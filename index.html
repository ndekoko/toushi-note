set: async (key, value) => {

Currency.

}

};

if (!withExit.length && !flows.length) return [];

const k = bucketKey(t.exitDate, grain);
byKey[k] = (byKey[k] || 0) + pnlAmount(t);

...withExit.map(t => t.exitDate),

/* ============================== capital management ============================== */
/* Start amount + a ledger of deposits and withdrawals. Kept separate from trade
P&L so that adding money never looks like a gain. */
function CapitalManager({ settings, setSettings, onClose }) {
const st = settings || {};
const [capital, setCapital] = useState(String(st.capital || ""));
const [startDate, setStartDate] = useState(st.capitalStart || todayStr());
const [amount, setAmount] = useState("");
const [date, setDate] = useState(todayStr());
const [note, setNote] = useState("");
const [kind, setKind] = useState("deposit"); // deposit | withdraw
const [msg, setMsg] = useState("");
const base = Number(st.capital) || 0;
const asc = (st.cashFlows || []).slice().sort((a, b) => a.date.localeCompare(b.date));
const netFlow = asc.reduce((a, c) => a + Number(c.amount), 0);
const current = base + netFlow;
const deposits = asc.filter(c => Number(c.amount) > 0).reduce((a, c) => a + Number(c.amount), 0);
const withdrawals = asc.filter(c => Number(c.amount) < 0).reduce((a, c) => a + Number(c.amount), 0);
// running principal after each cash flow, newest first for display
let running = base;
const timeline = [
{ id: "__start__", date: st.capitalStart || "—", amount: base, note: "運用開始（初期資金）", balance: base, isStart: true },
...asc.map(c => {
running += Number(c.amount);
return { ...c, amount: Number(c.amount), balance: running };
}),
].reverse();
const saveBase = () => {
const v = Number(capital);
if (!(v > 0)) { setMsg("初期資金は1以上で入力してください。"); return; }
setSettings({ ...st, capital: String(Math.round(v)), capitalStart: startDate });
setMsg("初期資金を更新しました。");
};
const addFlow = () => {
const v = Math.abs(Number(amount));
if (!(v > 0)) { setMsg("金額を入力してください。"); return; }
const signed = kind === "withdraw" ? -v : v;
const next = [...(st.cashFlows || []), { id: uid(), date, amount: String(Math.round(signed)), note: note.trim() }];
setSettings({ ...st, cashFlows: next });
setAmount(""); setNote("");
setMsg(kind === "withdraw" ? "出金を記録しました。" : "入金を記録しました。");
};
const removeFlow = (id) => {
setSettings({ ...st, cashFlows: (st.cashFlows || []).filter(c => c.id !== id) });
};
return (
<Panel style={{ padding: 18, marginBottom: 18 }}>
<div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
<Eyebrow>運用資金の管理</Eyebrow>
{onClose && <Btn variant="ghost" onClick={onClose}>閉じる</Btn>}
</div>
<div style={{ fontSize: 12.5, color: T.textMuted, lineHeight: 1.7, margin: "6px 0 14px 0" }}>
入金・出金は成績に含めません。資金を追加しても利益として計上されず、グラフでは資金の線だけが動きます。
</div>
{msg && <div style={{ fontSize: 12, color: T.jade, marginBottom: 10 }}>{msg}</div>}
<div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 16 }}>
<Field label="初期資金（円）">
<input type="number" inputMode="decimal" value={capital} onChange={e => setCapital(e.target.value)}
style={{ ...monoInputStyle, width: 150 }} />
</Field>
<Field label="運用開始日">
<input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={monoInputStyle} />
</Field>
<Btn onClick={saveBase}>更新</Btn>
</div>
<div style={{ borderTop: `1px solid ${T.hairlineSoft}`, paddingTop: 14, marginBottom: 14 }}>
<Eyebrow>入金・出金を追加</Eyebrow>
<div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "6px 0 10px 0" }}>
<Chip active={kind === "deposit"} color={T.jade} onClick={() => setKind("deposit")}>入金</Chip>
<Chip active={kind === "withdraw"} color={T.rust} onClick={() => setKind("withdraw")}>出金</Chip>
</div>
<div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
<Field label="日付">
<input type="date" value={date} onChange={e => setDate(e.target.value)} style={monoInputStyle} />
</Field>
<Field label="金額（円）">
<input type="number" inputMode="decimal" value={amount} onChange={e => setAmount(e.target.value)}
placeholder="500000" style={{ ...monoInputStyle, width: 130 }} />
</Field>
<Field label="メモ（任意）">
<input value={note} onChange={e => setNote(e.target.value)} placeholder="ボーナスから追加"
style={{ ...inputStyle, width: 180 }} />
</Field>
<Btn onClick={addFlow}><Icon name="plus" size={14} />記録</Btn>
</div>
</div>
<div style={{ borderTop: `1px solid ${T.hairlineSoft}`, paddingTop: 14 }}>
<Eyebrow>元金の推移</Eyebrow>
<div style={{ display: "flex", gap: 16, flexWrap: "wrap", margin: "8px 0 12px 0", fontFamily: FONT_MONO, fontSize: 12.5 }}>
<span style={{ color: T.textMuted }}>初期 {fmtYen(base)}</span>
<span style={{ color: T.jade }}>累計入金 +{fmtYen(deposits)}</span>
<span style={{ color: T.rust }}>累計出金 {fmtYen(withdrawals)}</span>
<span style={{ fontWeight: 600 }}>現在 {fmtYen(current)}</span>
</div>
{/* running balance, so the principal at any point in time is readable */}
<div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
{timeline.map(row => (
<div key={row.id} style={{
display: "flex", alignItems: "center", gap: 10, padding: "8px 10px",
background: row.isStart ? "transparent" : T.ink,
border: `1px solid ${row.isStart ? T.hairline : T.hairlineSoft}`,
borderRadius: 7, flexWrap: "wrap",
}}>
<span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: T.textFaint, whiteSpace: "nowrap", minWidth: 78 }}>{row.date}</span>
<span style={{
fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", minWidth: 92, textAlign: "right",
color: row.isStart ? T.textMuted : (row.amount >= 0 ? T.jade : T.rust),
}}>
{row.isStart ? fmtYen(row.amount) : `${row.amount >= 0 ? "+" : ""}${fmtYen(row.amount)}`}
</span>
<span style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: T.text, whiteSpace: "nowrap", minWidth: 96, textAlign: "right" }}>
→ {fmtYen(row.balance)}
</span>
<span style={{ fontSize: 12.5, color: T.textMuted, flex: 1, minWidth: 80 }}>{row.note}</span>
{!row.isStart && (
<button onClick={() => removeFlow(row.id)} style={{ background: "none", border: "none", color: T.textFaint, cursor: "pointer" }}>
<Icon name="x" size={14} />
</button>
)}
</div>
))}
</div>
{!asc.length && (
<div style={{ fontSize: 11.5, color: T.textFaint, marginTop: 8 }}>
入出金を記録すると、ここに元金の増減と各時点の残高が並びます。
</div>
)}
</div>
</Panel>
);
}
/* ============================== dashboard ============================== */
function Dashboard({ trades, principles, settings, setSettings }) {
const [grain, setGrain] = useState("month");
const [from, setFrom] = useState(0);
const [to, setTo] = useState(0);
const [showCapital, setShowCapital] = useState(false);
const [capitalDraft, setCapitalDraft] = useState("");
const baseCapital = Number(settings?.capital) || 0;
const closed = useMemo(() => trades.filter(t => t.status === "closed"), [trades]);
const open = useMemo(() => trades.filter(t => t.status === "open"), [trades]);
// capital in place today, i.e. start amount plus every deposit and withdrawal
const capital = baseCapital ? capitalAt(settings, todayStr()) : 0;
const flows = (settings?.cashFlows || []).map(c => Number(c.amount) || 0);
const deposits = flows.filter(v => v > 0).reduce((a, b) => a + b, 0);
const withdrawals = flows.filter(v => v < 0).reduce((a, b) => a + b, 0);
const fullSeries = useMemo(() => periodSeries(closed, settings, grain), [closed, settings, grain]);
useEffect(() => { setFrom(0); setTo(Math.max(0, fullSeries.length - 1)); }, [grain, fullSeries.length]);
const safeTo = Math.min(to, Math.max(0, fullSeries.length - 1));
const safeFrom = Math.min(from, safeTo);
const series = fullSeries.slice(safeFrom, safeTo + 1);
let runPnl = 0;
const windowed = series.map(p => {
runPnl += p.pnl;
return {
...p,
cumPnl: runPnl,
equity: p.capital + runPnl,
cumulative: p.capital > 0 ? Number(((runPnl / p.capital) * 100).toFixed(2)) : 0,
};
});
const periodKeys = useMemo(() => new Set(series.map(p => p.key)), [series]);
const inPeriod = useMemo(() => fullSeries.length
? closed.filter(t => t.exitDate && periodKeys.has(bucketKey(t.exitDate, grain)))
: closed, [fullSeries.length, closed, periodKeys, grain]);
const exp = useMemo(() => expectancy(inPeriod), [inPeriod]);
const dd = useMemo(() => maxDrawdown(inPeriod, settings), [inPeriod, settings]);
const totalPnl = inPeriod.map(pnlAmount).filter(v => v !== null).reduce((a, b) => a + b, 0);
const periodStartCapital = series.length ? series[0].capital : capital;
const periodReturnPct = periodStartCapital > 0 ? (totalPnl / periodStartCapital) * 100 : null;
const avgR = avg(inPeriod.map(rMultiple).filter(v => v !== null));
const overallAdherence = avg(inPeriod.map(adherencePct).filter(v => v !== null));
// How much is at risk if every open stop is hit, in yen. A dollar-denominated
// stop must be converted, otherwise a US position understates its risk by
// roughly the exchange rate.
const openRisk = open.reduce((a, t) => {
if (!t.entryPrice || !t.stopLoss || !t.quantity) return a;
const perShare = Math.abs(Number(t.entryPrice) - Number(t.stopLoss)) * Number(t.quantity);
if (isUSD(t)) {
const fx = Number(t.entryFx);
return fx > 0 ? a + perShare * fx : a;
}
return a + perShare;
}, 0);
// flag positions we could not value, so the figure is never silently short
const unvaluedRisk = open.filter(t => isUSD(t) && !(Number(t.entryFx) > 0)).length;
const principlePerf = useMemo(() => principles.map(p => {
const rel = inPeriod.filter(t => t.review?.principleAdherence?.[p.id] === "followed" || t.review?.principleAdherence?.[p.id] === "violated");
const f = rel.filter(t => t.review.principleAdherence[p.id] === "followed").map(pnlAmount).filter(v => v !== null);
const v = rel.filter(t => t.review.principleAdherence[p.id] === "violated").map(pnlAmount).filter(v2 => v2 !== null);
if (!f.length && !v.length) return null;
return { name: p.title, followed: f.length ? avg(f) : null, violated: v.length ? avg(v) : null };
}).filter(Boolean), [principles, inPeriod]);
const saveCapital = () => {
const v = Number(capitalDraft);
if (!(v > 0)) return;
setSettings({ ...(settings || {}), capital: String(Math.round(v)), capitalStart: todayStr() });
};
if (!baseCapital) {
return (
<div>
<Eyebrow>Overview — 全体の状況</Eyebrow>
<h2 style={{ fontFamily: FONT_DISPLAY, fontSize: 24, fontWeight: 600, letterSpacing: "-0.015em", margin: "0 0 14px 0" }}>まず運用資金を登録してください</h2>
<Panel style={{ padding: 18, maxWidth: 520 }}>
<div style={{ fontSize: 13, color: T.textMuted, lineHeight: 1.75, marginBottom: 14 }}>
成績は資金に対する割合で評価します。資金を登録しないと、大きく張った取引と小さく張った取引が同じ重みで集計され、
実際の損益とかけ離れた数字になってしまいます。
</div>
<Field label="運用資金（円）">
<input type="number" inputMode="decimal" value={capitalDraft} onChange={e => setCapitalDraft(e.target.value)}
placeholder="3000000" style={{ ...monoInputStyle, width: "100%" }} onKeyDown={e => e.key === "Enter" && saveCapital()} />
</Field>
<div style={{ marginTop: 12 }}>
<Btn onClick={saveCapital} disabled={!(Number(capitalDraft) > 0)}>登録する</Btn>
</div>
<div style={{ fontSize: 11.5, color: T.textFaint, marginTop: 12, lineHeight: 1.8 }}>
この口座に入れている金額の目安で構いません。あとから変更できます。
</div>
</Panel>
</div>
);
}
return (
<div>
<Eyebrow>Overview — 全体の状況</Eyebrow>
<h2 style={{ fontFamily: FONT_DISPLAY, fontSize: 24, fontWeight: 600, letterSpacing: "-0.015em", margin: "0 0 18px 0" }}>これまでの積み上げ</h2>
<div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 18 }}>
<StatCard
label="期待値"
value={exp ? fmtYen(exp.perTrade) : "—"}
tone={exp ? (exp.perTrade > 0 ? "up" : "down") : undefined}
sub={exp ? <>
<div style={{ color: T.textFaint }}>1トレードあたり</div>
<div>勝率 {exp.winRate.toFixed(0)}%</div>
<div style={{ paddingLeft: "1em" }}>× 平均利益 {fmtYen(exp.avgWin)}</div>
<div>敗率 {(100 - exp.winRate).toFixed(0)}%</div>
<div style={{ paddingLeft: "1em" }}>× 平均損失 {fmtYen(exp.avgLoss)}</div>
<div style={{ color: exp.perTrade > 0 ? T.jade : T.rust, marginTop: 3 }}>
{exp.perTrade > 0 ? "プラス。続けるほど資金は増える" : "マイナス。このままでは資金は減る"}
</div>
</> : null}
/>
<StatCard
label="元金（現在）"
value={fmtYen(capital)}
sub={<>
<div>初期 {fmtYen(baseCapital)}</div>
<div>
<span style={{ color: T.jade }}>入金 +{fmtYen(deposits)}</span>
{" / "}
<span style={{ color: T.rust }}>出金 {fmtYen(withdrawals)}</span>
</div>
<div style={{ color: T.textFaint, marginTop: 3 }}>評価額 {fmtYen(capital + totalPnl)}</div>
</>}
/>
<StatCard
label="期間損益"
value={fmtYen(totalPnl)}
tone={totalPnl > 0 ? "up" : totalPnl < 0 ? "down" : undefined}
sub={<>
<div>資金比 {fmtPct(periodReturnPct)}</div>
<div style={{ color: T.textFaint, marginTop: 4 }}>{inPeriod.length}トレード</div>
</>}
/>
<StatCard
label="最大ドローダウン"
value={dd ? `-${dd.pct.toFixed(1)}%` : "—"}
tone={dd && dd.pct > 0 ? "down" : undefined}
sub={dd ? <>
<div>{fmtYen(-dd.yen)}</div>
<div style={{ color: T.textFaint, marginTop: 4 }}>ピークからの</div>
<div style={{ color: T.textFaint }}>最大下落幅</div>
</> : null}
/>
<StatCard
label="損切り何回分"
value={avgR === null ? "—" : `${avgR.toFixed(2)}回分`}
tone={avgR === null ? undefined : avgR >= 0 ? "up" : "down"}
sub={<>
<div style={{ color: T.textFaint }}>1トレード平均</div>
<div style={{ marginTop: 4 }}>1.00回分＝</div>
<div>損切り額と同じ利益</div>
</>}
/>
<StatCard
label="現在の建玉リスク"
value={fmtYen(openRisk)}
tone={capital > 0 && openRisk / capital > 0.06 ? "down" : undefined}
sub={<>
<div>資金比 {capital > 0 ? ((openRisk / capital) * 100).toFixed(1) : "—"}%</div>
<div style={{ color: T.textFaint, marginTop: 4 }}>保有{open.length}件の損切りが</div>
<div style={{ color: T.textFaint }}>全て執行された場合</div>
{unvaluedRisk > 0 && (
<div style={{ color: T.rust, marginTop: 4 }}>為替未入力{unvaluedRisk}件は未算入</div>
)}
</>}
/>
</div>
<div style={{ display: "flex", gap: 16, marginBottom: 20, flexWrap: "wrap" }}>
<Panel style={{ padding: 18, flex: "2 1 420px", minWidth: 280 }}>
<div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
<Eyebrow>{grain === "month" ? "月次" : "年次"}パフォーマンス<br />上段=資産 / 下段=期間損益</Eyebrow>
<div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
<Chip active={grain === "month"} onClick={() => setGrain("month")}>月次</Chip>
<Chip active={grain === "year"} onClick={() => setGrain("year")}>年次</Chip>
</div>
</div>
<MiniMonthlyChart months={windowed} />
<RangeSlider

/>
</Panel>
<Panel style={{ padding: 18, flex: "1 1 200px", display: "flex", alignItems: "center", justifyContent: "center" }}>

{/* Capital sits at the foot of the page: it is reference information that is

/* ============================== principles (Plan) ============================== */
function Principles({ principles, setPrinciples }) {

const [draft, setDraft] = useState({ title: "", description: "" });
const startNew = () => { setDraft({ title: "", description: "" }); setEditing("new"); };
const startEdit = (p) => { setDraft({ title: p.title, description: p.description }); setEditing(p.id); };
const save = () => {
if (!draft.title.trim()) return;
if (editing === "new") setPrinciples([...principles, { id: uid(), ...draft, active: true, createdAt: todayStr() }]);
else setPrinciples(principles.map(p => p.id === editing ? { ...p, ...draft } : p));
setEditing(null);
};
const remove = (id) => setPrinciples(principles.filter(p => p.id !== id));
const toggleActive = (id) => setPrinciples(principles.map(p => p.id === id ? { ...p, active: !p.active } : p));
return (
<div>

/* ============================== trades (Do) ============================== */
const emptyTrade = () => ({

const target = trades.find(t => t.id === id);
if (!target || !closeDraft.exitPrice) return;
const held = Number(target.quantity) || 0;
const qty = Number(closeDraft.exitQuantity) || held;

setCloseError("");

review: null,

</div>
<div style={{ display: "flex", gap: 8, marginTop: 14 }}>

</Panel>
)}

<Eyebrow>保有中 ({open.length})</Eyebrow>

<span style={{ fontSize: 11, color: T.textFaint, whiteSpace: "nowrap" }}>/ {t.quantity}株</span>

</div>
{closeError && <div style={{ fontSize: 11.5, color: T.rust, marginTop: 6 }}>{closeError}</div>}

))}

)}
<Eyebrow>クローズ済 ({closed.length})</Eyebrow>

return (

/* ============================== history ============================== */
const HISTORY_FILTERS = [
{ id: "all", label: "すべて" }, { id: "win", label: "勝ちトレード" }, { id: "loss", label: "負けトレード" },
{ id: "reviewed", label: "振り返り済み" }, { id: "unreviewed", label: "未振り返り" },
];
const HISTORY_SORTS = [
{ id: "newest", label: "決済日: 新しい順" }, { id: "oldest", label: "決済日: 古い順" },
{ id: "returnDesc", label: "リターン: 高い順" }, { id: "returnAsc", label: "リターン: 低い順" },
];
function TradeHistory({ trades, principles }) {
const [query, setQuery] = useState("");
const [filter, setFilter] = useState("all");
const [sort, setSort] = useState("newest");
const [expanded, setExpanded] = useState({});
const [debouncedQuery, setDebouncedQuery] = useState("");
useEffect(() => {
// typing should not re-scan the whole history on every character
const id = setTimeout(() => setDebouncedQuery(query), 180);
return () => clearTimeout(id);
}, [query]);
const closed = useMemo(() => trades.filter(t => t.status === "closed"), [trades]);
// list of months that actually contain trades, used for the period slider
const monthKeys = useMemo(
() => Array.from(new Set(closed.filter(t => t.exitDate).map(t => t.exitDate.slice(0, 7)))).sort(),
[closed]
);
const [mFrom, setMFrom] = useState(0);
const [mTo, setMTo] = useState(0);
useEffect(() => { setMFrom(0); setMTo(Math.max(0, monthKeys.length - 1)); }, [monthKeys.length]);
const safeTo = Math.min(mTo, Math.max(0, monthKeys.length - 1));
const safeFrom = Math.min(mFrom, safeTo);
const periodSet = useMemo(() => new Set(monthKeys.slice(safeFrom, safeTo + 1)), [monthKeys, safeFrom, safeTo]);
const filtered = useMemo(() => closed.filter(t => {
const q = debouncedQuery.trim().toLowerCase();
if (q && !((t.ticker || "").toLowerCase().includes(q) || (t.name || "").toLowerCase().includes(q))) return false;
const r = returnPct(t);
if (filter === "win" && !(r > 0)) return false;
if (filter === "loss" && !(r <= 0)) return false;
if (filter === "reviewed" && !t.review) return false;
if (filter === "unreviewed" && t.review) return false;
if (monthKeys.length && t.exitDate && !periodSet.has(t.exitDate.slice(0, 7))) return false;
return true;
}), [closed, debouncedQuery, filter, monthKeys.length, periodSet]);
const sorted = useMemo(() => [...filtered].sort((a, b) => {
if (sort === "newest") return new Date(b.exitDate) - new Date(a.exitDate);
if (sort === "oldest") return new Date(a.exitDate) - new Date(b.exitDate);
if (sort === "returnDesc") return (returnPct(b) ?? -Infinity) - (returnPct(a) ?? -Infinity);
if (sort === "returnAsc") return (returnPct(a) ?? Infinity) - (returnPct(b) ?? Infinity);
return 0;
}), [filtered, sort]);
const rs = filtered.map(returnPct).filter(v => v !== null);
const filteredWinRate = rs.length ? (rs.filter(r => r > 0).length / rs.length) * 100 : null;
const filteredAvgReturn = avg(rs);
const filteredPnl = filtered.map(pnlAmount).filter(v => v !== null).reduce((a, b) => a + b, 0);
const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));
return (
<div>
<Eyebrow>History — 過去のトレードを直感的に振り返る</Eyebrow>

<input value={query} onChange={e => setQuery(e.target.value)} placeholder="銘柄名・コードで検索" style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
</div>
<select value={sort} onChange={e => setSort(e.target.value)} style={inputStyle}>
{HISTORY_SORTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
</select>
<div style={{ display: "flex", gap: 6 }}>
<Btn variant="ghost" onClick={() => setExpanded(Object.fromEntries(sorted.map(t => [t.id, true])))}>すべて展開</Btn>
<Btn variant="ghost" onClick={() => setExpanded({})}>すべて閉じる</Btn>
</div>
</div>
<div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>

</div>
<RangeSlider
length={monthKeys.length}
from={safeFrom} to={safeTo}
setFrom={setMFrom} setTo={setMTo}
labelOf={(i) => monthKeys[i] ? monthKeys[i].replace("-", "/") : "—"}
/>
</Panel>

<div style={{ display: "flex", gap: 20, marginBottom: 14, fontFamily: FONT_MONO, fontSize: 12.5, color: T.textMuted, padding: "0 4px", flexWrap: "wrap" }}>
<span>{filtered.length}件表示中</span>

<span>平均リターン <b style={{ color: filteredAvgReturn >= 0 ? T.jade : T.rust }}>{fmtPct(filteredAvgReturn)}</b></span>
<span>累計損益 <b style={{ color: filteredPnl >= 0 ? T.jade : T.rust }}>{fmtYen(filteredPnl)}</b></span>

</div>
)}
</div>
);
}

function Improve({ trades, principles, notes, setNotes }) {

const followed = relevant.filter(t => t.review.principleAdherence[p.id] === "followed").map(returnPct).filter(v => v !== null);
const violated = relevant.filter(t => t.review.principleAdherence[p.id] === "violated").map(returnPct).filter(v => v !== null);
const violationCount = relevant.filter(t => t.review.principleAdherence[p.id] === "violated").length;
return { p, followedAvg: avg(followed), violatedAvg: avg(violated), violationCount, sample: relevant.length };
}).filter(x => x.sample > 0).sort((a, b) => b.violationCount - a.violationCount), [principles, closed]);
// Tags can come from older records or an edited list, so create buckets on

closed.forEach(t => {

if (r === null) return;
(t.review?.emotionsExit || []).forEach(tag => {

if (!stats[tag]) stats[tag] = { win: 0, loss: 0 };
stats[tag][r >= 0 ? "win" : "loss"] += 1;
});
});
return Object.entries(stats)
.filter(([, v]) => v.win + v.loss > 0)
.sort((a, b) => (b[1].loss - a[1].loss) || (b[1].win - a[1].win));
}, [closed]);

const res = await fetch(url, { headers: syncHeaders(cfg) });

rev: (baseRev || 0) + 1,

updated_at: new Date().toISOString(),

const res = await fetch(`${normalizeUrl(cfg.url)}/rest/v1/${SYNC_TABLE}`, {
method: "POST",
headers: syncHeaders(cfg, { "Prefer": "resolution=merge-duplicates,return=representation" }),
body: JSON.stringify(body),

// RFC4180-ish serializer: quote when the value contains comma, quote, CR or LF.
function csvEscape(v) {

}
function toCSV(headers, rows) {
const lines = [headers.map(csvEscape).join(",")];
rows.forEach(r => lines.push(headers.map(h => csvEscape(r[h])).join(",")));

inQuotes = false; i++; continue;
}
field += c; i++; continue;
}
if (c === '"') { inQuotes = true; i++; continue; }
if (c === ",") { row.push(field); field = ""; i++; continue; }
if (c === "\r") { i++; continue; }
if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
field += c; i++;

if (field.length || row.length) { row.push(field); rows.push(row); }

return rows.filter(r => r.some(cell => cell.trim() !== ""));
}

const headers = rows[0].map(h => h.trim());

headers.forEach((h, idx) => { o[h] = r[idx] !== undefined ? r[idx] : ""; });
return o;
});

setSettings(st ? JSON.parse(st.value) : { capital: "" });

setSyncCfg(loadSyncConfig());
} catch (e) {
setErr("データの読み込みに失敗しました。");
} finally {
setLoaded(true);
}
})();
}, []);
const persist = useCallback(async (key, value) => {
try {
const res = await window.storage.set(key, JSON.stringify(value));
if (!res) setErr("保存に失敗しました。もう一度お試しください。");
} catch (e) {
setErr("保存に失敗しました。ブラウザのプライベートモードや容量制限をご確認ください。");
}
}, []);
const updatePrinciples = (next) => { setPrinciples(next); persist("principles", next); };
const updateTrades = (next) => { setTrades(next); persist("trades", next); };
const updateNotes = (next) => { setNotes(next); persist("improvement-notes", next); };
const updateSettings = (next) => { setSettings(next); persist("settings", next); };
const setViewMode = (mode) => { setViewModeState(mode); window.storage.set("ui-view-mode", mode).catch(() => {}); };
const isMobile = viewMode === "mobile";
const applyRemote = useCallback((payload) => {
// remote wins wholesale; guard the next auto-push so we don't echo it back
skipNextPush.current = true;
const p = payload || {};
setPrinciples(p.principles || []);
setTrades(p.trades || []);
setNotes(p.notes || []);
if (p.settings) setSettings(p.settings);
persist("principles", p.principles || []);
persist("trades", p.trades || []);
persist("improvement-notes", p.notes || []);
if (p.settings) persist("settings", p.settings);
}, [persist]);
const pullNow = useCallback(async (cfg = syncCfg, quiet = false) => {
if (!cfg) return;
setSyncStatus("pulling");
try {
const res = await syncPull(cfg);
if (res.found) {
applyRemote(res.payload);
setSyncRev(res.rev);
setLastSyncedAt(res.updatedAt || new Date().toISOString());
} else {
setSyncRev(0);
}
setSyncStatus("synced");
} catch (e) {
setSyncStatus("error");
if (!quiet) setErr(`同期の取得に失敗しました: ${e.message}`);
}
}, [syncCfg, applyRemote]);
const pushNow = useCallback(async (opts = {}) => {
if (!syncCfg) return;
setSyncStatus("pushing");
try {
const payload = { principles, trades, notes, settings };
const res = await syncPush(syncCfg, payload, opts.force ? undefined : syncRev);
if (res.conflict) {
setConflict({ remote: res.remote, payload });
setSyncStatus("conflict");
return;
}
setSyncRev(res.rev);
setLastSyncedAt(res.updatedAt || new Date().toISOString());
setSyncStatus("synced");
} catch (e) {
setSyncStatus("error");
setErr(`同期の保存に失敗しました: ${e.message}`);
}
}, [syncCfg, syncRev, principles, trades, notes, settings]);
// pull once when sync is configured (and when the tab regains focus)
useEffect(() => {
if (!loaded || !syncCfg) return;
pullNow(syncCfg, true);
const onFocus = () => pullNow(syncCfg, true);
window.addEventListener("focus", onFocus);
return () => window.removeEventListener("focus", onFocus);
}, [loaded, syncCfg?.url, syncCfg?.workspaceId]);
// debounced auto-push whenever the data changes
useEffect(() => {
if (!loaded || !syncCfg) return;
if (skipNextPush.current) { skipNextPush.current = false; return; }
if (pushTimer.current) clearTimeout(pushTimer.current);
pushTimer.current = setTimeout(() => { pushNow(); }, 1500);
return () => { if (pushTimer.current) clearTimeout(pushTimer.current); };
}, [principles, trades, notes, settings, loaded, syncCfg]);
const resolveConflict = async (mode) => {
if (mode === "remote") {
const c = conflict; setConflict(null);
applyRemote(c.remote.payload);
setSyncRev(c.remote.rev);
setLastSyncedAt(c.remote.updatedAt);
setSyncStatus("synced");
} else if (mode === "mine") {
const c = conflict; setConflict(null);
setSyncStatus("pushing");
try {
const res = await syncPush(syncCfg, c.payload, c.remote.rev);
setSyncRev(res.rev);
setLastSyncedAt(res.updatedAt || new Date().toISOString());
setSyncStatus("synced");
} catch (e) { setSyncStatus("error"); setErr(`上書きに失敗しました: ${e.message}`); }
} else {
setConflict(null);
setSyncStatus("conflict");
}
};
if (!loaded) {
return <div style={{ background: T.ink, minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", color: T.textMuted, fontFamily: FONT_BODY }}>読み込み中…</div>;
}
const content = (
<>
{err && (
<div style={{ marginBottom: 14, padding: "10px 12px", background: T.rustSoft, border: `1px solid ${T.rust}55`, borderRadius: 7, fontSize: 12.5, color: T.rust, lineHeight: 1.8, display: "flex", gap: 10, alignItems: "flex-start" }}>
<span style={{ flex: 1 }}>{err}</span>
<button onClick={() => setErr("")} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer", padding: 0, flexShrink: 0 }}>
<Icon name="x" size={14} />
</button>
</div>
)}
{tab === "dashboard" && <Dashboard trades={trades} principles={principles} settings={settings} setSettings={updateSettings} />}
{tab === "principles" && <Principles principles={principles} setPrinciples={updatePrinciples} />}
{tab === "trades" && <Trades trades={trades} setTrades={updateTrades} principles={principles} isMobile={isMobile} />}
{tab === "history" && <TradeHistory trades={trades} principles={principles} />}
{tab === "review" && <Review trades={trades} setTrades={updateTrades} principles={principles} />}
{tab === "improve" && <Improve trades={trades} principles={principles} notes={notes} setNotes={updateNotes} />}
{tab === "data" && (
<DataManager
trades={trades} principles={principles} notes={notes}
setTrades={updateTrades} setPrinciples={updatePrinciples} setNotes={updateNotes} setSettings={updateSettings}
syncCfg={syncCfg} setSyncCfg={setSyncCfg} syncStatus={syncStatus} lastSyncedAt={lastSyncedAt}
onPullNow={() => pullNow()} onPushNow={() => pushNow()}
/>
)}
</>
);
const shellExtras = (
<ConflictDialog
conflict={conflict}
onTakeRemote={() => resolveConflict("remote")}
onKeepMine={() => resolveConflict("mine")}
onCancel={() => resolveConflict("cancel")}
/>
);
return isMobile
? <MobileShell tab={tab} setTab={setTab} viewMode={viewMode} setViewMode={setViewMode}>{content}{shellExtras}</MobileShell>
: <DesktopShell tab={tab} setTab={setTab} viewMode={viewMode} setViewMode={setViewMode}>{content}{shellExtras}</DesktopShell>;
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
/* ---------------------------------------------------------------------------
   Startup bootstrap.

   The app is written in JSX, which a browser cannot run directly. Compiling it
   on every launch means downloading Babel (~1.5MB) and transforming ~150KB of
   source each time — the single largest cost on a phone.

   So we compile at most once and keep the result. On every later launch the
   cached JavaScript runs immediately and Babel is never fetched at all.
   The cache key includes a fingerprint of the source, so updating the app
   invalidates it automatically.
--------------------------------------------------------------------------- */
(function () {
  var BABEL_URL = "https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js";
  var CACHE_PREFIX = "compiled:v1:";
  var srcEl = document.getElementById("app-src");
  var source = srcEl ? srcEl.textContent : "";

  function fail(msg, err) {
    if (err) console.error(err);
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;color:#B8402F;font-family:system-ui,sans-serif;font-size:13px;line-height:1.8;text-align:center">' +
        msg + "</div>";
    }
  }

  // cheap, stable fingerprint of the source (FNV-1a)
  function fingerprint(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h.toString(36) + "-" + str.length.toString(36);
  }

  function run(code) {
    try {
      // indirect eval keeps the code in global scope, where React/ReactDOM live
      (0, eval)(code);
    } catch (e) {
      fail("アプリの起動に失敗しました。<br>ページを再読み込みしてください。", e);
    }
  }

  function readCache(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function writeCache(key, value) {
    try {
      // drop stale builds so the cache never accumulates
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf(CACHE_PREFIX) === 0 && k !== key) localStorage.removeItem(k);
      }
      localStorage.setItem(key, value);
    } catch (e) {
      // a full or unavailable store just means we compile again next time
    }
  }

  if (!source) { fail("アプリ本体が読み込めませんでした。"); return; }
  if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
    fail("必要なライブラリを読み込めませんでした。<br>通信環境をご確認のうえ、再読み込みしてください。");
    return;
  }

  var key = CACHE_PREFIX + fingerprint(source);
  var cached = readCache(key);
  if (cached) { run(cached); return; }

  // first run only: fetch the compiler, transform, cache, then start
  var s = document.createElement("script");
  s.src = BABEL_URL;
  s.onload = function () {
    try {
      var out = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
        compact: false,
        comments: false,
      }).code;
      writeCache(key, out);
      run(out);
    } catch (e) {
      fail("アプリの変換に失敗しました。<br>ページを再読み込みしてください。", e);
    }
  };
  s.onerror = function () {
    fail("必要なファイルを読み込めませんでした。<br>通信環境をご確認のうえ、再読み込みしてください。");
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
